<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet"><title>Arise Care Staff – Rostering</title>
<style>
:root{--bg:#eef6f5;--c:#fff;--t:#14263a;--m:#64748b;--p:#1d2e5a;--br:#33bcaa;--bd:#cfe3df;--g:#15803d;--r:#dc2626;--y:#a16207;--o:#c2410c;--pu:#7c3aed;--b:#2563eb;--k:#64748b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1730;--c:#16213f;--t:#e8eefb;--m:#9aa9c9;--bd:#2a3860;--p:#23806f;--br:#4fd1bd}}
:root[data-theme=dark]{--bg:#0e1730;--c:#16213f;--t:#e8eefb;--m:#9aa9c9;--bd:#2a3860;--p:#23806f;--br:#4fd1bd}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.logo{font-weight:800;color:var(--p);letter-spacing:.5px;font-size:17px}.logo small{font-weight:600;color:var(--m);font-size:11px}
.sh{display:grid;grid-template-columns:210px 1fr;min-height:100vh}aside{background:var(--c);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
aside .logo{padding:4px 10px 16px}aside a{display:flex;gap:8px;padding:10px;border-radius:10px;cursor:pointer;color:var(--m);font-weight:600;align-items:center}aside a:hover{background:var(--bg)}aside a.on{background:var(--p);color:#fff}aside a i{margin-left:auto;background:var(--r);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-style:normal}
main{padding:20px;min-width:0}.top{display:flex;gap:10px;margin-bottom:16px}.top input{flex:1}
input,select,button{font:inherit}input,select{padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--c);color:var(--t);min-width:0}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}.btn.s{background:var(--c);color:var(--p);border:1px solid var(--p)}.btn.d{background:var(--r)}.btn.sm{padding:5px 10px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}
.lnk{background:none;border:0;color:var(--p);font-weight:700;cursor:pointer}
h2{margin:0 0 4px;font-size:22px}.sub{color:var(--m);margin-bottom:16px}h4{margin:14px 0 4px;color:var(--p);font-size:12px;letter-spacing:.8px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.kpi{cursor:pointer}.kpi:hover{border-color:var(--p)}.kpi b{display:block;font-size:30px}.kpi span{color:var(--m);font-size:12px;font-weight:600;text-transform:uppercase}
.act{border-left:5px solid var(--r);margin-bottom:16px}.act div{display:flex;align-items:center;gap:10px;padding:6px 0;flex-wrap:wrap}.act div span{flex:1;min-width:150px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;color:var(--m);text-transform:uppercase;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}td{padding:10px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}tr.cl{cursor:pointer}tr.cl:hover td{background:var(--bg)}
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}.g{background:var(--g)}.r{background:var(--r)}.y{background:var(--y)}.o{background:var(--o)}.p{background:var(--pu)}.b{background:var(--b)}.k{background:var(--k)}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}.md{background:var(--c);border-radius:16px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}.md h3{margin:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--bd)}.kv span{color:var(--m)}.kv b{text-align:right}.ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal .h{font-weight:700;color:var(--m);font-size:11px;text-align:center}.cal .d{min-height:92px;background:var(--c);border:1px solid var(--bd);border-radius:8px;padding:4px;overflow:hidden}.cal .d.t{border-color:var(--p);border-width:2px}.cal .d.x{opacity:.4}.ev{font-size:11px;color:#fff;border-radius:4px;padding:1px 4px;margin-top:2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar i{display:block;height:14px;background:var(--p);border-radius:4px}.bar span{width:120px;font-size:12px;flex:none}
.lg{max-width:360px;margin:12vh auto;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center}.lg .logo{font-size:26px}.lg p{color:var(--m);margin:0}
.ph{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}.ph-h{background:var(--c);color:var(--t);border-bottom:4px solid var(--br);padding:12px 16px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}.ph-h b{font-size:16px}.ph-h span{flex:1;font-size:12px}.logo img{height:46px;max-width:100%;background:#fff;border-radius:8px;padding:2px}.lg .logo img{height:84px}.tot{display:flex;justify-content:space-between;font-weight:700;padding:12px 14px;border:2px solid var(--br);border-radius:10px;margin:12px 0;background:var(--bg)}.fld{margin-top:8px}.fld label{display:block;font-size:12px;font-weight:600;color:var(--m);margin-bottom:2px}.fld input{width:100%;min-height:44px}.pb{padding:14px;display:flex;flex-direction:column;gap:12px}
.bn{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--c);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}.bn a{flex:1;text-align:center;padding:10px 2px;font-size:11px;color:var(--m);font-weight:600;cursor:pointer}.bn a.on{color:var(--p)}.bn a div{font-size:20px}
.big{width:100%;padding:20px;font-size:20px;border-radius:14px;margin-top:10px}.ph h2{font-size:20px}.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--c);color:var(--t);font-weight:700}.tabs .on{background:var(--p);color:#fff}
@media(max-width:800px){.sh{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow-x:auto;padding:8px;gap:2px}aside .logo{display:none}aside a span{display:none}aside a{padding:10px 12px}main{padding:12px}.cal .d{min-height:60px}.ev{font-size:9px}}
</style></head><body><div id="app"></div><div id="modal"></div>

 <div class="card"><h4 style="margin-top:0">Timesheet compliance</h4>${bar('Submitted',sub,pastS.length)}${bar('Missing',pastS.length-sub,pastS.length)}${bar('Approved',m.filter(s=>s.appr).length,pastS.length)}<div class="kv"><span>Completion</span><b>${pastS.length?Math.round(100*sub/pastS.length):100}%</b></div></div></div>
 <div class="card"><h4 style="margin-top:0">Staff hours (top 8)</h4>${hrsBy.map(x=>bar(x.n,+hrs(x.t),+hrs(hrsBy[0].t))+`<div class="sub" style="margin:-2px 0 0 128px;font-size:11px">Overtime ${hrs(x.o)}h</div>`).join('')}</div><br>
 ${tbl(['Facility','Total shifts','Filled','Unfilled','Total hours'],D.fac.map(f=>{const x=m.filter(s=>s.fac==f.id&&!s.canc);return`<tr><td>${f.name}</td><td>${x.length}</td><td>${x.filter(s=>s.staff).length}</td><td>${x.filter(s=>!s.staff).length}</td><td>${hrs(x.reduce((a,s)=>a+(s.cout?calc(s).act:0),0))}</td></tr>`}))}`}
function alerts(){const n=D.notes.filter(x=>x.to=='m');n.forEach(x=>x.read=1);save();return`<h2>Alerts &amp; audit trail</h2><h4>Dr. Doug's notifications</h4>${tbl(['When','Message'],n.map(x=>`<tr><td>${fDT(x.ts)}</td><td>${x.text}</td></tr>`))}<h4>Audit trail</h4>${tbl(['When','Action'],D.audit.slice(0,100).map(x=>`<tr><td>${fDT(x.ts)}</td><td>${x.t}</td></tr>`))}`}
function set(){return`<h2>Settings</h2><div class="card"><p>Data is stored in this browser only (LocalStorage). Shifts come from <b>Shifts → ＋ Add / import shifts</b>; staff and facilities are added on their own pages.</p><div class="ac"><button class="btn" onclick="A.remind()">Send automatic reminders</button><button class="btn s" onclick="A.demo()">Load sample data (demo only)</button><button class="btn d" onclick="A.reset()">Clear all shifts &amp; timesheets</button></div></div>`}
function cal(){const c=S.cm,y=c.getFullYear(),mo=c.getMonth(),f0=new Date(y,mo,1).getDay(),dn=new Date(y,mo+1,0).getDate(),C={g:'var(--g)',r:'var(--r)',y:'var(--y)',o:'var(--o)',p:'var(--pu)',b:'var(--b)',k:'var(--k)'};
 let h=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="h">${d}</div>`).join('');for(let i=0;i<f0;i++)h+='<div class="d x"></div>';
 for(let d=1;d<=dn;d++){const k=y+'-'+pad(mo+1)+'-'+pad(d),ev=D.shifts.filter(L).filter(s=>s.date==k);h+=`<div class="d ${k==TD?'t':''}"><b>${d}</b>${ev.slice(0,3).map(s=>`<div class="ev" style="background:${C[st(s)[1]]}" onclick="A.sm('${s.id}')">${hm(s.start).replace(':00','')} ${s.role} ${s.staff?sf(s.staff).name.split(' ')[0]:'OPEN'}</div>`).join('')}${ev.length>3?`<small>+${ev.length-3} more</small>`:''}</div>`}
 return`<h2>Calendar</h2><div class="flt"><button class="btn sm s" onclick="S.cm=new Date(${y},${mo-1},1);draw()">◀</button><b style="min-width:140px;text-align:center">${c.toLocaleDateString('en-AU',{month:'long',year:'numeric'})}</b><button class="btn sm s" onclick="S.cm=new Date(${y},${mo+1},1);draw()">▶</button><button class="btn sm" onclick="S.cm=new Date(T0.getFullYear(),T0.getMonth(),1);draw()">Today</button><button class="btn sm s" onclick="A.go('shifts')">List view</button></div><div class="cal">${h}</div>
 <div class="flt" style="margin-top:12px"><span class="bd g">Filled</span><span class="bd r">Unfilled</span><span class="bd y">Pending</span><span class="bd b">Payroll ready</span><span class="bd p">Submitted</span><span class="bd o">Missing</span><span class="bd k">Cancelled</span></div>`}
// ---------- Staff portal ----------
const SN=[['home','🏠','Home'],['shifts','📅','My Shifts'],['tsh','🕐','Timesheet'],['not','🔔','Alerts'],['prof','👤','Profile']];
function stfUI(){const u=me(),un=D.notes.filter(n=>n.to==u.id&&!n.read).length;
 return`<div class="ph"><div class="ph-h"><img src="${LOGO}" alt="Arise Care Staff" style="height:36px"><span>Viewing as: ${u.name} · ${u.role} · ${u.loc}</span><button class="lnk" onclick="A.out()">Switch</button></div><div class="pb">${({home,shifts:mys,tsh,not,prof})[S.v]?({home,shifts:mys,tsh,not,prof})[S.v](u):home(u)}</div><nav class="bn">${SN.map(n=>`<a class="${S.v==n[0]?'on':''}" onclick="S.v='${n[0]}';draw()"><div>${n[1]}</div>${n[2]}${n[0]=='not'&&un?` (${un})`:''}</a>`).join('')}</nav></div>`}
const mine=u=>D.shifts.filter(s=>s.staff==u.id&&!s.canc).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
const sc=(s,x='')=>`<div class="card"><b>🏥 ${fc(s).name}</b><div>${s.role} · ${fD(s.date)}</div><div>${tr(s)} · ${hrs(calc(s).sch)} hrs</div><div style="margin-top:6px">${bd(s)}</div>${x}</div>`;
const wkOf=d=>{const x=at(d,'00:00');x.setDate(x.getDate()+(7-x.getDay())%7);return dk(x)},addTo=(d,n)=>{const x=at(d,'00:00');x.setDate(x.getDate()+n);return dk(x)};
function tsf(s){if(s.sub)return`<div class="card" style="border-color:var(--g)"><b>✅ TIMESHEET SUBMITTED</b><div>Submitted: ${fDT(s.sub)}${s.tsNo?' · '+s.tsNo:''}</div><div>${s.appr?'🟢 Approved – payroll ready':'🟡 Awaiting approval'}</div></div>`;
 return`<div class="card"><b>Shift complete</b><div class="sub" style="margin:4px 0">${hrs(calc(s).act)} hours recorded. Add it to your weekly timesheet.</div><button class="btn big" style="margin:0" onclick="A.toTs('${s.id}')">REVIEW &amp; SUBMIT TIMESHEET</button></div>`}
function clock(s){if(!s.acc)return sc(s,`<div class="ac"><button class="btn" onclick="A.accept('${s.id}')">ACCEPT SHIFT</button><button class="btn s" onclick="A.decline('${s.id}')">DECLINE</button></div>`);
 if(s.cout)return sc(s)+tsf(s);
 if(s.cin)return sc(s,`<h4>Shift in progress</h4><div>Clocked in at ${fT(s.cin)}</div><div>Scheduled finish: ${hm(s.end)}</div><button class="btn big d" onclick="A.cout('${s.id}')">CLOCK OUT</button>`);
 return sc(s,s.date==TD?`<button class="btn big" onclick="A.cin('${s.id}')">CLOCK IN</button>`:'')}
function home(u){const h=new Date().getHours(),m=mine(u),td=m.filter(s=>s.date==TD),nx=m.filter(s=>s.date>TD&&s.acc)[0];
 const off=D.shifts.filter(s=>!s.staff&&!s.canc&&s.date>=TD&&fc(s).loc==u.loc&&s.role==u.role&&!s.declined.includes(u.id)&&!conflict(u.id,s));
 return`<h2>Good ${h<12?'morning':h<18?'afternoon':'evening'}, ${u.name.split(' ')[0]} 👋</h2>${off.map(s=>sc(s,`<h4>New shift available</h4><div class="ac"><button class="btn" onclick="A.accept('${s.id}')">ACCEPT SHIFT</button><button class="btn s" onclick="A.decline('${s.id}')">DECLINE</button></div>`).replace('<b>🏥','<b>🆕 🏥')).join('')}
 ${m.filter(s=>!s.acc&&s.date>TD).map(s=>sc(s,`<h4>Shift assigned to you</h4><div class="ac"><button class="btn" onclick="A.accept('${s.id}')">ACCEPT SHIFT</button><button class="btn s" onclick="A.decline('${s.id}')">DECLINE</button></div>`)).join('')}
 <h4>Today's shift</h4>${td.length?td.map(clock).join(''):'<div class="card">No shift today.</div>'}${nx?`<h4>Next shift</h4>${sc(nx)}`:''}`}
function mys(u){const m=mine(u),t=S.tab,l=m.filter(s=>t=='Upcoming'?s.date>TD:t=='Today'?s.date==TD:s.date<TD);
 return`<h2>My Shifts</h2><div class="tabs">${['Upcoming','Today','Completed'].map(x=>`<button class="${t==x?'on':''}" onclick="S.tab='${x}';draw()">${x.toUpperCase()}</button>`).join('')}</div>${(t=='Completed'?l.reverse():l).map(s=>t=='Today'?clock(s):sc(s)).join('')||'<div class="card">No shifts.</div>'}`}
const ADJ=()=>`<div class="card adj" style="margin-top:8px"><div class="fld"><label>Description</label><input data-a="desc"></div><div class="fld"><label>Date</label><input type="date" data-a="date"></div><div class="fld"><label>Hours</label><input type="number" step="0.25" inputmode="decimal" data-a="hours" oninput="A.recalc()"></div><div class="fld"><label>Authorised by</label><input data-a="auth"></div></div>`;
function tsh(u){const we=S.we||(S.we=wkOf(TD)),ws=addTo(we,-6),w=mine(u).filter(s=>s.date>=ws&&s.date<=we&&s.cout),open=w.filter(s=>!s.sub),done=w.filter(s=>s.sub),ro=(l,v)=>`<div class="fld"><label>${l}</label><input value="${v}" readonly></div>`;
 const rowH=s=>{const c=calc(s),g=mins(s.cin,s.cout);return`<div class="card shr" data-id="${s.id}" data-g="${g}" style="margin-top:8px"><b>${at(s.date,'00:00').toLocaleDateString('en-AU',{weekday:'long'})} · ${fD(s.date)}</b><div>${fc(s).name} · ${fT(s.cin)} – ${fT(s.cout)}</div><div class="fld"><label>Meal break (min)</label><input type="number" min="0" step="5" inputmode="numeric" data-k="brk" value="${c.brk}" oninput="A.recalc()"></div><div class="fld"><label>Staff initials</label><input maxlength="5" data-k="ini"></div><div class="fld"><label>Client initials</label><input maxlength="5" data-k="cini"></div><div style="margin-top:8px">Total hours: <b data-k="hrs">${hrs(c.act)}</b></div></div>`};
 return`<h2>Timesheet</h2><div class="card"><div class="fld"><label>Pay week ending (Sunday)</label><input type="date" value="${we}" onchange="S.we=this.value;draw()"></div>${ro('Staff name',u.name)}${ro('Employee / Staff ID',u.id.toUpperCase())}${ro('Role',u.role=='SW'?'Support Worker':u.role)}${ro('Location',u.loc)}${ro('Contact number',u.phone)}${ro('Timesheet no.','TS-'+u.id.toUpperCase()+'-'+we.replace(/-/g,''))}</div>
 <h4>Shift details</h4><div id="shl">${open.map(rowH).join('')||'<div class="card">No completed shifts waiting for this week. Clock out of a shift to add it here.</div>'}</div>${done.length?`<h4>Already submitted this week</h4>${done.map(s=>sc(s)+tsf(s)).join('')}`:''}
 <div class="tot"><span>Weekly total</span><span id="wt">0.00 h</span></div>
 <h4>Additional hours / adjustments</h4><div id="adjs">${ADJ()}</div><button class="btn s sm" style="margin-top:8px" onclick="$('#adjs').insertAdjacentHTML('beforeend',ADJ())">Add another adjustment</button>
 <h4>Staff declaration</h4><p class="sub">I declare that the hours recorded on this timesheet are accurate and represent the shifts I worked. I confirm that I have completed the required duties and breaks as recorded and have notified Arise Care Staff of any discrepancies or changes. I understand that this timesheet may be used for payroll and client billing purposes.</p>
 <label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="agree" style="width:24px;height:24px;flex:none" onchange="$('#subb').disabled=!this.checked"><span>I agree with the declaration above</span></label>
 <div class="card" style="margin-top:8px"><div class="fld"><label>Staff signature (type your full name)</label><input id="sig"></div><div class="fld"><label>Date</label><input id="sigd" type="date" value="${TD}"></div></div><div class="card" style="margin-top:8px"><b>Client sign-off</b><div class="sub" style="margin:2px 0">Hand the device to the client or supervisor to sign for the hours above.</div><div class="fld"><label>Client / supervisor name</label><input id="sup"></div><div class="fld"><label>Date</label><input id="supd" type="date"></div><div class="fld"><label>Client signature</label><canvas id="pad" style="width:100%;height:150px;background:#fff;border:1px solid var(--bd);border-radius:10px;touch-action:none"></canvas></div><button class="btn s sm" style="margin-top:6px" onclick="A.padClear()">Clear signature</button></div>
 <button class="btn big" id="subb" disabled onclick="A.subTs()">SUBMIT TIMESHEET</button><button class="btn s big" style="margin-top:0" onclick="A.csvMine()">Download my copy (CSV)</button><div id="msg" style="font-weight:600"></div>`}
function not(u){const n=D.notes.filter(x=>x.to==u.id);n.forEach(x=>x.read=1);save();return`<h2>Notifications</h2>${n.map(x=>`<div class="card">${x.text}<div class="sub" style="margin:4px 0 0">${fDT(x.ts)}</div></div>`).join('')||'<div class="card">Nothing yet.</div>'}`}
function prof(u){const m=mine(u),r=(a,b)=>`<div class="kv"><span>${a}</span><b>${b}</b></div>`;
 return`<h2>${u.name}</h2><div class="card">${r('Role',RN[u.role])}${r('Location',u.loc)}${r('Phone',u.phone||'—')}${r('Email',u.email||'—')}${r('AHPRA / qualification',u.ahpra)}${r('Completed shifts',m.filter(s=>s.cout).length)}${r('Timesheet compliance',comp(u.id)+'%')}</div>
 <div class="card"><b>My availability</b><br><select style="width:100%;margin-top:8px;padding:14px" onchange="A.setAv(this.value)">${['Available','Unavailable','Preferred','Overnight Only','Morning Only','Afternoon Only'].map(a=>`<option ${u.avail==a?'selected':''}>${a}</option>`).join('')}</select></div>`}
draw();
</script></body></html>
